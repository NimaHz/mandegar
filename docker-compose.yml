name: mandegar

x-build-args: &build-args
  NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
  NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}

x-runtime-env: &runtime-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-mandegar}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-mandegar}
  UPLOAD_DIR: /app/uploads

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mandegar}
      POSTGRES_USER: ${POSTGRES_USER:-mandegar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Tehran
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: .
      target: tools
      args: *build-args
    image: mandegar-tools:latest
    env_file: .env
    environment: *runtime-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["pnpm", "db:migrate"]

  app:
    build:
      context: .
      target: runner
      network: host
      args:
        <<: *build-args
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
      secrets:
        - database_url
        - session_secret
    image: mandegar-app:latest
    restart: unless-stopped
    env_file: .env
    environment: *runtime-env
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/srv/uploads:ro
      - ${TLS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
  uploads:
  nginx-cache:

secrets:
  database_url:
    environment: BUILD_DATABASE_URL
  session_secret:
    environment: SESSION_SECRET
