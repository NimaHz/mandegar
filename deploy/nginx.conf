worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 32m;
    client_body_timeout 60s;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rid=$request_id rt=$request_time '
                    'urt=$upstream_response_time cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/rss+xml application/manifest+json
               image/svg+xml font/ttf;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=forms:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=warranty:10m rate=30r/m;
    limit_req_status 429;

    proxy_cache_path /var/cache/nginx/next levels=1:2 keys_zone=next_static:20m
                     max_size=1g inactive=30d use_temp_path=off;

    upstream mandegar_app {
        zone mandegar_app 64k;
        server app:3000 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        server_name mandegar.example www.mandegar.example;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://mandegar.example$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.mandegar.example;

        ssl_certificate /etc/letsencrypt/live/mandegar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mandegar/privkey.pem;

        return 301 https://mandegar.example$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name mandegar.example;

        ssl_certificate /etc/letsencrypt/live/mandegar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mandegar/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;

        add_header X-Request-ID $request_id always;

        location ~ /\.(?!well-known/) {
            return 404;
        }

        location ~* \.(?:env|git|sql|sqlite|bak|old|orig|swp|log|ini|conf|ya?ml|lock|sh|pem|key)$ {
            return 404;
        }

        location ~ "^/uploads/(?:[A-Za-z0-9][A-Za-z0-9_-]*/){0,3}[A-Za-z0-9][A-Za-z0-9_-]*\.(?:webp|avif|jpe?g|png|mp4|webm|pdf)$" {
            root /srv;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }

        location /uploads/ {
            return 404;
        }

        location ^~ /_next/static/ {
            proxy_pass http://mandegar_app;
            proxy_cache next_static;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
            proxy_cache_lock on;
            access_log off;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location ~ ^/api/(?:admin/)?auth(?:/|$) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://mandegar_app;
        }

        location ^~ /api/tickets {
            limit_req zone=forms burst=10 nodelay;
            proxy_pass http://mandegar_app;
        }

        location ^~ /api/contact {
            limit_req zone=forms burst=5 nodelay;
            proxy_pass http://mandegar_app;
        }

        location ^~ /api/warranty {
            limit_req zone=warranty burst=10 nodelay;
            proxy_pass http://mandegar_app;
        }

        location ^~ /api/admin/media {
            client_max_body_size 210m;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://mandegar_app;
        }

        location / {
            proxy_pass http://mandegar_app;
        }
    }
}
