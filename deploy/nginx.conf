user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 32m;
    client_body_timeout 60s;

    map $request_uri $log_request_uri {
        "~^(?<log_path>[^?]*)\?(?:.*&)?t=" "$log_path?t=[redacted]";
        default $request_uri;
    }

    map $http_referer $log_referer {
        "~^(?<log_referer_path>[^?]*)\?(?:.*&)?t=" "$log_referer_path?t=[redacted]";
        default $http_referer;
    }

    log_format main '$remote_addr [$time_local] "$request_method $log_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$log_referer" "$http_user_agent" rid=$request_id '
                    'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/rss+xml application/manifest+json
               image/svg+xml font/ttf;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=forms:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=warranty:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=og:10m rate=60r/m;
    limit_req_status 429;

    map $http_cookie $admin_session {
        "~(?:^|;) *__Host-mandegar_sid=[A-Za-z0-9_-]{20,}" 1;
        default 0;
    }

    map $http_accept $image_format {
        "~image/avif" avif;
        "~image/webp" webp;
        default original;
    }

    proxy_cache_path /var/cache/nginx/next levels=1:2 keys_zone=next_static:20m
                     max_size=1g inactive=30d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:20m
                     max_size=4g inactive=30d use_temp_path=off;

    upstream mandegar_app {
        zone mandegar_app 64k;
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name mandegar.example www.mandegar.example;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://mandegar.example$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name www.mandegar.example;

        ssl_certificate /etc/letsencrypt/live/mandegar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mandegar/privkey.pem;

        return 301 https://mandegar.example$request_uri;
    }

    server {
        listen 443 ssl http2 default_server;
        server_name mandegar.example;

        ssl_certificate /etc/letsencrypt/live/mandegar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mandegar/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;

        add_header X-Request-ID $request_id always;

        location ~ /\.(?!well-known/) {
            return 404;
        }

        location ~* \.(?:env|git|sql|sqlite|bak|old|orig|swp|log|ini|conf|ya?ml|lock|sh|pem|key)$ {
            return 404;
        }

        location ^~ /uploads/private/ {
            return 404;
        }

        location ~ "^/uploads/(?:[A-Za-z0-9][A-Za-z0-9_-]*/){0,3}[A-Za-z0-9][A-Za-z0-9_-]*\.(?:webp|avif|jpe?g|png|mp4|webm|pdf)$" {
            root /var/lib/mandegar;
            try_files $uri @uploads;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Request-ID $request_id always;
        }

        location @uploads {
            proxy_pass http://mandegar_app;
            access_log off;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Request-ID $request_id always;
        }

        location /uploads/ {
            return 404;
        }

        location ^~ /_next/static/ {
            proxy_pass http://mandegar_app;
            proxy_cache next_static;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
            proxy_cache_lock on;
            access_log off;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Request-ID $request_id always;
        }

        location ^~ /_next/image {
            proxy_pass http://mandegar_app;
            proxy_cache media;
            proxy_cache_key "$request_uri|$image_format";
            proxy_ignore_headers Vary;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 15s;
            access_log off;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Request-ID $request_id always;
        }

        location ^~ /og/ {
            limit_req zone=og burst=30 nodelay;
            proxy_pass http://mandegar_app;
            proxy_cache media;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
            proxy_cache_lock on;
            access_log off;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Request-ID $request_id always;
        }

        location ~ ^/api/(?:admin/)?auth(?:/|$) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://mandegar_app;
        }

        location ^~ /api/tickets {
            limit_req zone=forms burst=10 nodelay;
            proxy_pass http://mandegar_app;
        }

        location ^~ /api/contact {
            limit_req zone=forms burst=5 nodelay;
            proxy_pass http://mandegar_app;
        }

        location ^~ /api/warranty {
            limit_req zone=warranty burst=10 nodelay;
            proxy_pass http://mandegar_app;
        }

        location ^~ /api/admin/media {
            default_type application/json;
            if ($admin_session = 0) {
                add_header Cache-Control "no-store" always;
                add_header X-Request-ID $request_id always;
                return 401 '{"error":{"code":"UNAUTHORIZED","message":"Authentication required"}}';
            }
            client_max_body_size 210m;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://mandegar_app;
        }

        location / {
            proxy_pass http://mandegar_app;
        }
    }
}
